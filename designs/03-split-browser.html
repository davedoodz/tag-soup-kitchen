<!doctype html>
<html lang="en" data-design-id="hifi-03-split-browser" data-design-title="Split browser — AColorBright">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The accepted split-browser direction, built out in the AColorBright design system."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 44'%3E%3Cpath d='M0 44V0h27.5C38.82 0 48 9.18 48 20.5V44H33.5V22c0-4.14-3.36-7.5-7.5-7.5H14.5V44H0Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../shared/acolorbright.css" />
    <link rel="stylesheet" href="../shared/hifi.css" />
    <link rel="stylesheet" href="../shared/review.css" />
    <script src="../shared/projects.js"></script>
    <script src="../shared/review.js" defer></script>
    <title>Split browser — David Lafond Designs</title>
    <style>
      .shell {
        display: grid;
        height: var(--shell-height);
        grid-template-rows: auto minmax(0, 1fr);
      }

      .workspace {
        display: grid;
        min-height: 0;
        grid-template-columns: clamp(320px, 27vw, 420px) minmax(0, 1fr);
      }

      /* Index pane */

      .index-pane {
        display: grid;
        min-height: 0;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        border-right: 1px solid var(--line);
      }

      .index-controls {
        display: grid;
        gap: 12px;
        padding: var(--spacing-24) var(--spacing-24) var(--spacing-16);
      }

      .index-head {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 96px 48px;
        align-items: center;
        gap: 12px;
        padding: var(--spacing-8) var(--spacing-24);
        border-block: 1px solid var(--line);
        color: var(--color-graphite);
        font-size: var(--text-caption);
        line-height: var(--leading-caption);
      }

      .index-head span:last-child {
        text-align: right;
      }

      .index-scroll {
        min-height: 0;
        overflow-y: auto;
        scrollbar-color: var(--color-fog) transparent;
        scrollbar-width: thin;
      }

      .index-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .row {
        display: grid;
        width: 100%;
        grid-template-columns: 40px minmax(0, 1fr) 96px 48px;
        align-items: center;
        gap: 12px;
        padding: var(--spacing-16) var(--spacing-24);
        border: 0;
        background: transparent;
        color: var(--color-ink-black);
        cursor: pointer;
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
      }

      .index-list li:nth-child(odd) .row {
        background: var(--color-mist);
      }

      .row:hover {
        background: var(--color-fog);
      }

      .row__index,
      .row__discipline,
      .row__year {
        color: var(--color-graphite);
        font-size: var(--text-caption);
        font-variant-numeric: tabular-nums;
        line-height: var(--leading-caption);
      }

      .row__title {
        overflow: hidden;
        font-size: var(--text-body);
        line-height: var(--leading-body);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row__year {
        text-align: right;
      }

      .row[aria-current='true'],
      .index-list li:nth-child(odd) .row[aria-current='true'] {
        background: var(--color-ink-black);
        color: var(--color-paper);
      }

      .row[aria-current='true'] .row__index,
      .row[aria-current='true'] .row__discipline,
      .row[aria-current='true'] .row__year {
        color: var(--color-fog);
      }

      .index-foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--spacing-16);
        padding: 12px var(--spacing-24);
        border-top: 1px solid var(--line);
        color: var(--color-graphite);
        font-size: var(--text-caption);
        line-height: var(--leading-caption);
      }

      .index-foot b {
        color: var(--color-ink-black);
        font-variant-numeric: tabular-nums;
        font-weight: 400;
      }

      .index-empty {
        padding: var(--spacing-32) var(--spacing-24);
      }

      .index-empty strong {
        display: block;
        font-size: var(--text-subheading);
        font-weight: 400;
        line-height: var(--leading-subheading);
      }

      .index-empty p {
        max-width: 32ch;
        margin: 12px 0 0;
        color: var(--color-graphite);
        font-size: var(--text-body-sm);
        line-height: var(--leading-body-sm);
      }

      /* Case pane */

      .case-pane {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        scrollbar-color: var(--color-fog) transparent;
        scrollbar-width: thin;
      }

      .case {
        width: min(100%, 960px);
        margin-inline: auto;
        padding: var(--spacing-32) var(--spacing-32) 96px;
      }

      .case__back {
        display: none;
      }

      .case__kicker {
        margin: var(--spacing-32) 0 12px;
        color: var(--color-graphite);
        font-size: var(--text-caption);
        line-height: var(--leading-caption);
      }

      .case__title {
        max-width: 22ch;
        margin: 0;
        font-size: var(--text-display);
        font-weight: 400;
        line-height: var(--leading-display);
      }

      .case__lead {
        max-width: 52ch;
        margin: var(--spacing-24) 0 0;
        font-size: var(--text-body);
        line-height: var(--leading-body);
      }

      .case__split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr);
        gap: var(--spacing-64);
        margin-top: var(--spacing-64);
      }

      .chapter-block + .chapter-block {
        margin-top: var(--spacing-32);
      }

      .chapter-block h2 {
        display: flex;
        align-items: center;
        gap: var(--spacing-16);
        margin: 0 0 12px;
        font-size: var(--text-subheading);
        font-weight: 400;
        line-height: var(--leading-subheading);
      }

      .chapter-block p {
        max-width: 58ch;
        margin: 0;
        color: var(--color-graphite);
        font-size: var(--text-body-sm);
        line-height: var(--leading-body-sm);
      }

      .case__aside {
        display: grid;
        align-content: start;
        gap: var(--spacing-32);
      }

      .case__metrics {
        margin-top: var(--spacing-64);
      }

      .case__metrics h2 {
        margin: 0 0 var(--spacing-24);
        color: var(--color-graphite);
        font-size: var(--text-caption);
        font-weight: 400;
        line-height: var(--leading-caption);
      }

      .case__steps {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--spacing-16);
        margin-top: 96px;
        padding-top: var(--spacing-24);
        border-top: 1px solid var(--color-ink-black);
      }

      .case__step-copy {
        color: var(--color-graphite);
        font-size: var(--text-caption);
        line-height: var(--leading-caption);
      }

      .case__step-copy b {
        display: block;
        color: var(--color-ink-black);
        font-size: var(--text-body);
        font-weight: 400;
        line-height: var(--leading-body);
      }

      .case__step-actions {
        display: flex;
        gap: var(--spacing-8);
      }

      @media (max-width: 1023px) {
        .case__title {
          font-size: var(--text-heading);
          line-height: var(--leading-heading);
        }

        .case__split {
          grid-template-columns: 1fr;
          gap: var(--spacing-32);
          margin-top: var(--spacing-32);
        }
      }

      @media (max-width: 639px) {
        .workspace {
          grid-template-columns: 1fr;
          overflow: hidden;
        }

        .index-pane {
          border-right: 0;
        }

        .index-controls,
        .index-head,
        .row,
        .index-foot,
        .index-empty {
          padding-inline: var(--spacing-16);
        }

        .index-foot__hint {
          display: none;
        }

        .case-pane {
          position: fixed;
          z-index: 20;
          inset: 0;
          padding-bottom: calc(var(--review-bar-height, 0px) + var(--spacing-24));
          background: var(--color-paper);
          transform: translateX(100%);
          transition: transform 280ms var(--ease);
          visibility: hidden;
        }

        .shell.is-case-open .case-pane {
          transform: translateX(0);
          visibility: visible;
        }

        .case {
          padding: var(--spacing-16) var(--spacing-16) var(--spacing-64);
        }

        .case__back {
          display: inline-flex;
          align-items: center;
          gap: var(--spacing-8);
          min-height: 40px;
          padding: 0;
          border: 0;
          background: transparent;
          color: var(--color-ink-black);
          cursor: pointer;
          font: inherit;
          font-size: var(--text-body-sm);
          letter-spacing: inherit;
        }

        .case__kicker {
          margin-top: var(--spacing-24);
        }

        .case__title {
          max-width: none;
        }

        .case__steps {
          margin-top: var(--spacing-64);
        }

        .case__step-actions {
          width: 100%;
        }

        .case__step-actions .button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <svg hidden aria-hidden="true">
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M15.8 15.8l4.7 4.7" />
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M20.5 12h-17" />
        <path d="M10.5 5l-7 7 7 7" />
      </symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24">
        <path d="M3.5 12h17" />
        <path d="M13.5 5l7 7-7 7" />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M3.5 6.5h17" />
        <path d="M3.5 12h17" />
        <path d="M3.5 17.5h17" />
      </symbol>
    </svg>

    <div class="shell" id="shell">
      <header class="topbar">
        <div class="topbar__identity">
          <span class="topbar__wordmark">David Lafond Designs</span>
          <span class="topbar__context">Split browser — direction 2 of 2</span>
        </div>
        <div class="topbar__actions">
          <a class="topbar__link" href="index.html">Directions</a>
          <a class="topbar__link" href="01-contact-sheet.html">Contact sheet</a>
          <a class="topbar__link" href="../archive/index.html">Archive</a>
          <button class="icon-frame" type="button" aria-label="Menu">
            <svg class="icon" aria-hidden="true"><use href="#icon-menu" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="index-pane" id="indexPane" aria-label="Project index">
          <div class="index-controls">
            <div class="field">
              <svg class="icon icon--16" aria-hidden="true"><use href="#icon-search" /></svg>
              <input
                class="field__input"
                id="search"
                type="search"
                placeholder="Project or discipline"
                autocomplete="off"
                spellcheck="false"
                aria-label="Filter projects"
              />
            </div>
            <div class="chips" id="chips" role="group" aria-label="Filter by discipline"></div>
          </div>

          <div class="index-head" aria-hidden="true">
            <span>No.</span>
            <span>Project</span>
            <span>Discipline</span>
            <span>Year</span>
          </div>

          <div class="index-scroll" id="indexScroll">
            <ul class="index-list" id="indexList" aria-label="Projects"></ul>
            <div class="index-empty" id="indexEmpty" hidden>
              <strong>No matches</strong>
              <p>Clear the field, or pick a discipline to see what sits under it.</p>
            </div>
          </div>

          <div class="index-foot">
            <span>Showing <b id="count">12</b> of <b>12</b></span>
            <span class="index-foot__hint">↑ ↓ to move · / to search</span>
          </div>
        </section>

        <section class="case-pane" id="casePane" aria-label="Selected project">
          <article class="case" id="case"></article>
        </section>
      </main>
    </div>

    <script>
      ;(() => {
        const projects = window.PORTFOLIO_PROJECTS
        const shell = document.querySelector('#shell')
        const indexPane = document.querySelector('#indexPane')
        const indexList = document.querySelector('#indexList')
        const indexScroll = document.querySelector('#indexScroll')
        const indexEmpty = document.querySelector('#indexEmpty')
        const casePane = document.querySelector('#casePane')
        const caseRoot = document.querySelector('#case')
        const chips = document.querySelector('#chips')
        const search = document.querySelector('#search')
        const count = document.querySelector('#count')
        const mobile = matchMedia('(max-width: 639px)')

        const disciplines = ['All', ...new Set(projects.map((project) => project.category))]

        let discipline = 'All'
        let visible = projects.map((_, index) => index)
        let selected = 0
        let caseOpen = false
        let savedScroll = 0

        const escapeText = (value) =>
          value.replace(
            /[&<>'"]/g,
            (character) =>
              ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character],
          )

        function renderChips() {
          chips.innerHTML = disciplines
            .map(
              (name) =>
                `<button class="chip" type="button" data-discipline="${escapeText(name)}" aria-pressed="${
                  name === discipline
                }">${escapeText(name)}</button>`,
            )
            .join('')
        }

        function renderList() {
          indexList.innerHTML = visible
            .map((index) => {
              const project = projects[index]
              return `
                <li>
                  <button
                    class="row"
                    type="button"
                    data-index="${index}"
                    aria-current="${index === selected}"
                    aria-label="${escapeText(project.title)}, ${escapeText(project.category)}, ${
                      project.year
                    }"
                  >
                    <span class="row__index">${String(index + 1).padStart(2, '0')}</span>
                    <span class="row__title">${escapeText(project.title)}</span>
                    <span class="row__discipline">${escapeText(project.category)}</span>
                    <span class="row__year">${project.year}</span>
                  </button>
                </li>
              `
            })
            .join('')

          count.textContent = String(visible.length)
          indexEmpty.hidden = visible.length !== 0
          indexList.hidden = visible.length === 0
        }

        function caseMarkup(project, index) {
          const position = visible.indexOf(index)
          const previous = position > 0 ? projects[visible[position - 1]] : null
          const next = position < visible.length - 1 ? projects[visible[position + 1]] : null
          const chapters = [
            ['Problem', project.problem],
            ['Approach', project.approach],
            ['Outcome', project.outcome],
          ]

          return `
            <button class="case__back" type="button" id="caseBack">
              <svg class="icon icon--16" aria-hidden="true"><use href="#icon-arrow-left" /></svg>
              All projects
            </button>
            <div
              class="cover cover--${project.tone}"
              style="--cover-ratio: 16 / 9; --cover-rule: 72px"
              role="img"
              aria-label="${escapeText(project.title)} — ${escapeText(project.subtitle)}"
            >
              <span class="cover__index">${String(index + 1).padStart(2, '0')} / ${projects.length}</span>
              <span class="cover__mark" aria-hidden="true">${escapeText(
                project.title.slice(0, 2).toUpperCase(),
              )}</span>
              <span class="cover__note">${escapeText(project.client)}</span>
            </div>

            <p class="case__kicker">${escapeText(project.category)} — ${project.year} — ${escapeText(
              project.subtitle,
            )}</p>
            <h1 class="case__title" id="caseTitle" tabindex="-1">${escapeText(project.title)}</h1>
            <p class="case__lead">${escapeText(project.lead)}</p>

            <div class="case__split">
              <div>
                ${chapters
                  .map(
                    ([heading, body], position) => `
                      <section class="chapter-block">
                        <h2><span class="chapter__badge">${position + 1}</span>${heading}</h2>
                        <p>${escapeText(body)}</p>
                      </section>
                    `,
                  )
                  .join('')}
              </div>
              <div class="case__aside">
                <dl class="facts">
                  <div class="fact"><dt>Client</dt><dd>${escapeText(project.client)}</dd></div>
                  <div class="fact"><dt>Role</dt><dd>${escapeText(project.role)}</dd></div>
                  <div class="fact"><dt>Team</dt><dd>${escapeText(project.team)}</dd></div>
                  <div class="fact"><dt>Duration</dt><dd>${escapeText(project.duration)}</dd></div>
                  <div class="fact"><dt>Year</dt><dd>${project.year}</dd></div>
                </dl>
              </div>
            </div>

            <section class="case__metrics">
              <h2>What changed</h2>
              <ul class="metrics">
                ${project.metrics
                  .map(
                    (metric) => `
                      <li class="metric">
                        <p class="metric__value">${escapeText(metric.value)}</p>
                        <p class="metric__label">${escapeText(metric.label)}</p>
                      </li>
                    `,
                  )
                  .join('')}
              </ul>
            </section>

            <nav class="case__steps" aria-label="Move through the index">
              <p class="case__step-copy">
                ${previous ? 'Previous' : 'Next'}
                <b>${escapeText((previous ?? next ?? project).title)}</b>
              </p>
              <div class="case__step-actions">
                <button
                  class="button button--outlined"
                  type="button"
                  data-step="previous"
                  ${previous ? '' : 'disabled'}
                >
                  Previous
                </button>
                <button
                  class="button button--filled"
                  type="button"
                  data-step="next"
                  ${next ? '' : 'disabled'}
                >
                  Next project
                </button>
              </div>
            </nav>
          `
        }

        function paintCase(index) {
          if (index < 0) {
            caseRoot.innerHTML = ''
            casePane.setAttribute('aria-label', 'No project selected')
            return
          }
          const project = projects[index]
          caseRoot.innerHTML = caseMarkup(project, index)
          casePane.setAttribute('aria-label', `${project.title} case study`)
          casePane.scrollTop = 0
        }

        function keepRowVisible() {
          const row = indexList.querySelector(`[data-index="${selected}"]`)
          if (!row) return
          const item = row.parentElement
          const top = item.offsetTop
          const bottom = top + item.offsetHeight
          if (top < indexScroll.scrollTop) indexScroll.scrollTop = top
          else if (bottom > indexScroll.scrollTop + indexScroll.clientHeight) {
            indexScroll.scrollTop = bottom - indexScroll.clientHeight
          }
        }

        function select(index, { focus = false, openCase = false } = {}) {
          if (!visible.includes(index)) return
          selected = index
          for (const row of indexList.querySelectorAll('.row')) {
            row.setAttribute('aria-current', String(Number(row.dataset.index) === index))
          }
          paintCase(index)
          keepRowVisible()
          if (focus) indexList.querySelector(`[data-index="${index}"]`)?.focus()
          if (openCase && mobile.matches) openMobileCase()
        }

        function filter() {
          const query = search.value.trim().toLocaleLowerCase()
          visible = projects
            .map((project, index) => ({ project, index }))
            .filter(({ project }) => {
              const haystack =
                `${project.title} ${project.subtitle} ${project.category} ${project.client}`.toLocaleLowerCase()
              const matchesDiscipline = discipline === 'All' || project.category === discipline
              return haystack.includes(query) && matchesDiscipline
            })
            .map(({ index }) => index)

          if (visible.length === 0) {
            selected = -1
            paintCase(-1)
          } else if (!visible.includes(selected)) {
            selected = visible[0]
            paintCase(selected)
          } else {
            paintCase(selected)
          }

          renderList()
          keepRowVisible()
        }

        function move(destination) {
          if (visible.length === 0) return
          const position = Math.max(visible.indexOf(selected), 0)
          const next = {
            next: Math.min(position + 1, visible.length - 1),
            previous: Math.max(position - 1, 0),
            first: 0,
            last: visible.length - 1,
          }[destination]
          select(visible[next], { focus: true })
        }

        function step(direction) {
          const position = visible.indexOf(selected)
          const target = direction === 'next' ? position + 1 : position - 1
          if (target < 0 || target >= visible.length) return
          select(visible[target])
          requestAnimationFrame(() => caseRoot.querySelector(`[data-step="${direction}"]`)?.focus())
        }

        function openMobileCase() {
          if (!mobile.matches || selected < 0) return
          savedScroll = indexScroll.scrollTop
          caseOpen = true
          shell.classList.add('is-case-open')
          syncPanes()
          requestAnimationFrame(() => caseRoot.querySelector('#caseBack')?.focus())
        }

        function closeMobileCase() {
          if (!caseOpen) return
          caseOpen = false
          shell.classList.remove('is-case-open')
          syncPanes()
          requestAnimationFrame(() => {
            indexScroll.scrollTop = savedScroll
            indexList.querySelector(`[data-index="${selected}"]`)?.focus()
          })
        }

        function syncPanes() {
          const small = mobile.matches
          casePane.inert = small && !caseOpen
          casePane.setAttribute('aria-hidden', String(small && !caseOpen))
          indexPane.inert = small && caseOpen
          indexPane.setAttribute('aria-hidden', String(small && caseOpen))
        }

        chips.addEventListener('click', (event) => {
          const chip = event.target.closest('[data-discipline]')
          if (!chip) return
          discipline = chip.dataset.discipline
          for (const button of chips.querySelectorAll('.chip')) {
            button.setAttribute('aria-pressed', String(button === chip))
          }
          filter()
        })

        search.addEventListener('input', filter)
        search.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowDown' && visible.length) {
            event.preventDefault()
            select(visible.includes(selected) ? selected : visible[0], { focus: true })
          }
          if (event.key === 'Escape' && search.value) {
            event.preventDefault()
            search.value = ''
            filter()
          }
        })

        indexList.addEventListener('click', (event) => {
          const row = event.target.closest('[data-index]')
          if (!row) return
          select(Number(row.dataset.index), { openCase: true })
        })

        indexList.addEventListener('keydown', (event) => {
          const destination = {
            ArrowDown: 'next',
            ArrowUp: 'previous',
            Home: 'first',
            End: 'last',
          }[event.key]
          if (destination) {
            event.preventDefault()
            move(destination)
            return
          }
          if (event.key === 'Enter' && !mobile.matches) {
            caseRoot.querySelector('#caseTitle')?.focus()
          }
        })

        caseRoot.addEventListener('click', (event) => {
          if (event.target.closest('#caseBack')) {
            closeMobileCase()
            return
          }
          const button = event.target.closest('[data-step]')
          if (button && !button.disabled) step(button.dataset.step)
        })

        addEventListener('keydown', (event) => {
          if (event.key !== '/') return
          const tag = document.activeElement?.tagName
          if (tag === 'INPUT' || tag === 'TEXTAREA') return
          event.preventDefault()
          search.focus()
          search.select()
        })

        mobile.addEventListener('change', () => {
          if (!mobile.matches) {
            caseOpen = false
            shell.classList.remove('is-case-open')
          }
          syncPanes()
        })

        renderChips()
        renderList()
        paintCase(selected)
        syncPanes()
      })()
    </script>
